services:
  - type: web
    name: telegram-music-player-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm run start
    healthCheckPath: /health
    # Render only auto-deploys a push that touched rootDir, so a commit that is
    # entirely web/ — most of them, since the server builds the web bundle —
    # was being skipped silently. These are the paths that actually change what
    # this service serves.
    buildFilter:
      paths:
        - server/**
        - web/**
        - render.yaml
    envVars:
      # Vite 8, @vitejs/plugin-react and oxlint all require
      # ^20.19.0 || >=22.12.0; the web bundle is built here (see server's
      # build script), so 22.10.0 fails the build outright.
      - key: NODE_VERSION
        value: 24.19.0
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # The Cloudflare Worker that streams audio (stream-worker/) and the
      # secret its links are signed with. Without both, audio is proxied
      # through this service and counts against its bandwidth.
      - key: STREAM_BASE_URL
        sync: false
      - key: STREAM_SIGNING_SECRET
        sync: false
