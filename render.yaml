services:
  - type: web
    name: telegram-music-player-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      # Vite 8, @vitejs/plugin-react and oxlint all require
      # ^20.19.0 || >=22.12.0; the web bundle is built here (see server's
      # build script), so 22.10.0 fails the build outright.
      - key: NODE_VERSION
        value: 24.19.0
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
