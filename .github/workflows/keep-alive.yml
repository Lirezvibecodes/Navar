name: Keep Render service warm

# Render's free plan spins the server down after ~15 min idle, and the next
# request pays a 30-60s cold start. A Mini App reopens fresh every session, so
# that cold start is what a user actually feels as "the app is slow". This
# just keeps traffic flowing often enough that it never gets the chance to
# spin down.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 25 https://telegram-music-player-server.onrender.com/health
