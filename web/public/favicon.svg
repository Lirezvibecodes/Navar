<!-- Navaar's mark: one play triangle drawn on the same pixel grid the rest of
     the app is drawn on, in the lime that means playback everywhere else.
     Three columns rather than a diagonal, because at 16px a real hypotenuse is
     a smear and a staircase is legible. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="3" fill="#030303"/>
  <g fill="#DFFC8E">
    <rect x="5" y="3" width="2" height="10"/>
    <rect x="7" y="5" width="2" height="6"/>
    <rect x="9" y="7" width="2" height="2"/>
  </g>
</svg>
